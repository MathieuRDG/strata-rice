# Strata — réglages de l'installation (lu par install.sh). Modifier puis relancer ./install.sh.

# Web apps de la hotbar quand aucun client natif n'est installé (ouvertes dans une fenêtre Firefox dédiée)
JELLYFIN_URL="http://jellyfin.local:8096"
NAVIDROME_URL="http://navidrome.local:4533"
PROXMOX_URL="https://proxmox.local:8006"

# Second écran (16" 1080p 60 Hz) : à gauche ou à droite de l'écran principal
SECONDARY_POSITION="left"

# Écran principal : HDR et VRR (KWin)
ENABLE_HDR="yes"
ENABLE_VRR="yes"

# Fond d'écran : day | night
WALLPAPER="day"
