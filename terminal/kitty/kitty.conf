# Strata — kitty
# CozetteVector (grille 13 px : 9.75 pt = 13 px à 96 dpi ; 19.5 pour du ×2)
font_family      family="CozetteVector"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.75
disable_ligatures always
text_composition_strategy legacy

# Fenêtre
window_padding_width 16
placement_strategy top-left
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0

# Transparence + flou (kitty est exclu des règles d'opacité KWin)
background_opacity 0.80
background_blur 1
dynamic_background_opacity yes

# Curseur : bloc plein, sans clignotement ni animation
cursor_shape block
cursor_blink_interval 0
cursor_trail 0

# Onglets carrés
tab_bar_edge bottom
tab_bar_style separator
tab_separator " ┃ "
tab_title_template " {index}:{title} "
active_tab_font_style bold
inactive_tab_font_style normal

# Palette Strata
foreground            #EDE3CF
background            #2B2118
selection_foreground  #EDE3CF
selection_background  #3E5A26
cursor                #7CCB4A
cursor_text_color     #1F1812
url_color             #7FB2E5
url_style             straight
active_border_color   #7CCB4A
inactive_border_color #4A3420
bell_border_color     #E8B23A
active_tab_foreground   #1F1812
active_tab_background   #7CCB4A
inactive_tab_foreground #B8A88C
inactive_tab_background #3A2C20
tab_bar_background      #1F1812
mark1_background #7CCB4A
mark2_background #E8B23A
mark3_background #B58AD6

# ANSI : noir, rouge, vert, jaune, bleu, magenta, cyan, blanc (+ vives ≈ +15 %)
color0  #1F1812
color8  #413B36
color1  #C8553D
color9  #D06E5A
color2  #5D9B3A
color10 #75AA58
color3  #E8B23A
color11 #EBBE58
color4  #7FB2E5
color12 #92BEE9
color5  #B58AD6
color13 #C09CDC
color6  #5ED6D0
color14 #76DCD7
color7  #EDE3CF
color15 #F0E7D6

# Opacité à la volée
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>d set_background_opacity default

# Taille initiale
remember_window_size no
initial_window_width 120c
initial_window_height 36c
