<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Strata : CozetteVector n'annonce pas spacing=mono ; kitty l'ignore sans ça. -->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains"><string>CozetteVector</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
</fontconfig>
